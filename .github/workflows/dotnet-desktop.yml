name: .NET

on:
  push:
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Debug
    - name: Test
      run: dotnet test --no-restore --verbosity normal --logger trx --results-directory "TestResults" --coverlet --coverlet-output-format opencover
    - name: Publish Test 
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Test Results on dev
        path: ./TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: 'false'
    - name: Create an Issue
      if: failure()
      uses: JasonEtco/create-an-issue@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        filename: .github/ultimate_issue_template.md
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Compress Release
      run: tar -czvf calculator.tar.gz -C /home/runner/work/IT-Automation_2026/IT-Automation_2026/UltimateApp/bin/Release/net8.0/ .
    - name: Publish Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: calculator.tar.gz
        #artifacts: "/home/runner/work/IT-Automation_2026/IT-Automation_2026/UltimateApp/bin/Release/net8.0/"
        #token: ${{ secrets.GITHUB_TOKEN }}
        tag: "0.41"
