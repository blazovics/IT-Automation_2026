name: .NET

on:
  push:
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
